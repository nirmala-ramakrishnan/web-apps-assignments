<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Greeting based on time of day -->
    <h3> Example 1: Dynamic Greeting </h3>
    <div id="greetingOutput"></div>

    <!-- Show text when I click a button -->
    <h3> Example 2: Button Click Event Handling </h3>
    <button onclick="setButtonText()">Click Me</button>
    <div id="buttonClickText"></div>

    <h3> Example 3: Button Click Shows Date </h3>
    <button onclick="setButtonTextDate()">Click Me for Date</button>
    <div id="buttonClickTextDate"></div>

    <h3> Example 4: Javascript numeric values </h3>
    <label> Number 1: <input id = "num1"></label><br>
    <label> Number 2: <input id = "num2"></label><br>
    <button onclick="addNumbers()">Add the numbers</button>
    <div id="addValue"></div>

    

    <script src="script.js"></script>
</body>

</html>
